<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:'BHS';src:url('bhs.ttf') format('truetype');font-display:block}
  @font-face{font-family:'LS';src:url('ls-bd.ttf') format('truetype');font-weight:700;font-display:block}
  *{margin:0;padding:0;box-sizing:border-box}
  /* 플레이스토어 그래픽 이미지 규격: 1024×500 (JPG/24bit PNG, 투명 불가) */
  html,body{width:1024px;height:500px;overflow:hidden}
  .bg{position:absolute;inset:0;background:#2f6e4a}
  /* 은은한 결 — 단색 판때기로 두면 싸 보인다. 브랜드 톤 안에서 명도만 살짝 흔든다. */
  .bg::after{content:'';position:absolute;inset:0;
    background:radial-gradient(120% 90% at 78% 18%, rgba(255,255,255,.13), transparent 55%),
               radial-gradient(90% 70% at 12% 92%, rgba(0,0,0,.16), transparent 60%)}

  .left{position:absolute;left:64px;top:0;height:500px;width:600px;
    display:flex;flex-direction:column;justify-content:center;gap:14px;z-index:2}
  .word{font-family:'BHS';font-size:96px;line-height:1;color:#fff;letter-spacing:-2px}
  .slogan{font-family:'BHS';font-size:44px;line-height:1.2;color:#f2c56a;letter-spacing:-1px}
  .desc{font-family:'LS';font-weight:700;font-size:23px;line-height:1.65;color:rgba(255,255,255,.9);margin-top:6px}
  .chips{display:flex;gap:10px;margin-top:14px}
  .chip{font-family:'LS';font-weight:700;font-size:17px;color:#2f6e4a;background:#f9f1e4;
    padding:9px 16px;border-radius:999px}

  /* 오키 — 오른쪽에서 살짝 잘리게 두면 화면 밖으로 이어지는 느낌이 난다 */
  .oki{position:absolute;right:34px;bottom:-18px;width:400px;z-index:1}
  .oki img{width:100%;display:block;filter:drop-shadow(0 12px 26px rgba(0,0,0,.22))}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="left">
    <div class="word">5키로</div>
    <div class="slogan">오늘 5키로, 오키?</div>
    <div class="desc">크루와 함께 달리는 러닝 기록<br>GPS · 갤럭시워치 · 크루 랭킹</div>
    <div class="chips">
      <span class="chip">실시간 GPS</span>
      <span class="chip">크루 피드</span>
      <span class="chip">기록 공유</span>
    </div>
  </div>
  <div class="oki"><img src="oki-full.png" alt=""></div>
</body>
</html>
